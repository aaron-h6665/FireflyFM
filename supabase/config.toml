project_id = "fireflyfm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "fireflyfm://auth-callback"
additional_redirect_urls = ["fireflyfm://**"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.process-notification-outbox]
enabled = true
verify_jwt = false

[functions.stripe-connect-onboard]
enabled = true
verify_jwt = true

[functions.billing-create-invoice]
enabled = true
verify_jwt = true

[functions.billing-invoice-action]
enabled = true
verify_jwt = true

[functions.billing-document-link]
enabled = true
verify_jwt = true

[functions.stripe-connect-webhook]
enabled = true
verify_jwt = false

[functions.stripe-connect-return]
enabled = true
verify_jwt = false

[functions.google-forms-oauth]
enabled = true
verify_jwt = true

[functions.sync-google-onboarding-forms]
enabled = true
# Directors are authenticated in the function; the scheduled worker uses its
# own secret header and therefore cannot use platform JWT verification.
verify_jwt = false

[functions.sync-google-parent-form]
enabled = false
verify_jwt = true
